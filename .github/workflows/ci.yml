name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Public boundary
        run: python scripts/check_public_boundary.py
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Tests
        run: python -m pytest --cov
      - name: Build distributions
        run: python -m build
      - name: Clean wheel smoke
        shell: bash
        run: |
          python -m venv /tmp/hypertrader-wheel-smoke
          /tmp/hypertrader-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/hypertrader-wheel-smoke/bin/python -m hypertrader_research --compact
